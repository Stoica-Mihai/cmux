<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cmuxd</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  /* Served by cmuxd itself, not a CDN, so this works offline and on a device
     that has no Nerd Font installed. */
  @font-face { font-family:'cmux-mono'; src:url('/fonts/mono.woff2') format('woff2');
               font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:'cmux-mono'; src:url('/fonts/mono-bold.woff2') format('woff2');
               font-weight:700; font-style:normal; font-display:swap; }
  /* Powerline separators and Nerd Font icons. Last in the stack, so it is only
     fetched for glyphs the text font lacks. */
  @font-face { font-family:'cmux-symbols'; src:url('/fonts/symbols.woff2') format('woff2');
               font-display:swap; }

  :root { --bg:#0f1216; --panel:#161b22; --line:#242c37; --fg:#c9d1d9; --dim:#7d8590; --accent:#4ba3ff; --warn:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  aside { width:300px; flex:0 0 300px; border-right:1px solid var(--line);
          background:var(--panel); display:flex; flex-direction:column; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:8px; }
  header b { font-size:15px; letter-spacing:.02em; }
  header span { color:var(--dim); font-size:12px; }
  #list { flex:1; overflow-y:auto; padding:6px; }
  .row { padding:9px 10px; border-radius:6px; cursor:pointer; border:1px solid transparent; }
  .row:hover { background:#1d242e; }
  .row.on { background:#1d2733; border-color:var(--accent); }
  .row .name { display:flex; align-items:center; gap:6px; font-weight:600; }
  .row .cmd { color:var(--dim); font-size:12px; font-family:ui-monospace, monospace;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .row .cwd { color:#5c6672; font-size:11px; white-space:nowrap; overflow:hidden;
              text-overflow:ellipsis; }
  .badge { font-size:10px; padding:1px 5px; border-radius:99px; border:1px solid var(--line);
           color:var(--dim); font-weight:500; }
  .badge.warn { color:var(--warn); border-color:var(--warn); }
  .badge.busy { color:var(--accent); border-color:var(--accent); }
  footer { padding:10px; border-top:1px solid var(--line); display:flex; gap:6px; }
  input, button { font:inherit; border-radius:6px; border:1px solid var(--line);
                  background:#0f1419; color:var(--fg); padding:7px 9px; }
  input { flex:1; min-width:0; font-family:ui-monospace, monospace; font-size:12px; }
  button { cursor:pointer; background:#1d2733; }
  button:hover { border-color:var(--accent); }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #bar { padding:8px 12px; border-bottom:1px solid var(--line); color:var(--dim);
         font-size:12px; font-family:ui-monospace, monospace; }
  #term { flex:1; min-height:0; padding:6px 8px; }
  #empty { flex:1; display:flex; align-items:center; justify-content:center;
           color:var(--dim); text-align:center; padding:24px; }
  /* display:flex outranks the UA's [hidden]{display:none}, so state it here. */
  #empty[hidden] { display:none; }
  #empty code { color:var(--fg); font-size:12px; }
  @media (max-width: 720px) {
    body { flex-direction:column; }
    aside { width:auto; flex:0 0 auto; max-height:42vh;
            border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>
<aside>
  <header><b>cmuxd</b><span id="count"></span></header>
  <div id="list"></div>
  <footer>
    <input id="cmd" value="bash -l" aria-label="command to run" spellcheck="false">
    <button id="spawn">Spawn</button>
  </footer>
</aside>
<main>
  <div id="bar">no session selected</div>
  <!-- One child, so the flex container does not turn the text and <br> into
       separate anonymous flex items and drop the line break. -->
  <div id="empty"><div>No sessions yet — spawn one from the panel, or run<br>
    <code>cmux ctl spawn . -- bash -l</code></div></div>
  <div id="term" hidden></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const params = new URLSearchParams(location.search);
const want  = params.get("session");          // ?session=N to open one directly
const $ = (id) => document.getElementById(id);

let term, fit, ws, current = null, autoAttached = false;

function bootTerminal() {
  term = new Terminal({
    // A locally installed symbols font wins over the served one, so a desktop
    // that already has it never downloads the 1 MB.
    fontFamily: "cmux-mono, cmux-symbols, ui-monospace, SFMono-Regular, Menlo, monospace",
    fontSize: 13, cursorBlink: true, scrollback: 10000,
    // WezTerm's default palette. Setting only fg/bg left the 16 ANSI colours
    // at xterm.js's defaults, so anything colourful — a statusline especially
    // — came out a different colour than in the terminal it mirrors.
    theme: {
      background: '#000000', foreground: '#b3b3b3',
      cursor: '#53ae71', selectionBackground: '#4d52f8',
      black:   '#000000', red:     '#cc5555', green:  '#55cc55', yellow:  '#cdcd55',
      blue:    '#5555cc', magenta: '#cc55cc', cyan:   '#7acaca', white:   '#cccccc',
      brightBlack:  '#555555', brightRed:     '#ff5555',
      brightGreen:  '#55ff55', brightYellow:  '#ffff55',
      brightBlue:   '#5555ff', brightMagenta: '#ff55ff',
      brightCyan:   '#55ffff', brightWhite:   '#ffffff',
    },
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("term"));
  fit.fit();
  // "0" marks input; see pushSize for "1". Without the prefix the daemon
  // could not tell a resize from something to type.
  term.onData(d => ws && ws.readyState === 1 && ws.send("0" + d));
  window.addEventListener("resize", () => { fit.fit(); pushSize(); });
}

// Our own size, not the session's: the daemon runs the pty at the smallest
// size among everyone attached, so the phone and the desktop can share one
// session without fighting over it.
function pushSize() {
  if (!term || !ws || ws.readyState !== 1) return;
  ws.send("1" + JSON.stringify({ rows: term.rows, cols: term.cols }));
}

async function refresh() {
  let sessions = [];
  try {
    const r = await fetch("/api/sessions");
    // cmuxd never refuses a request; a 401/403 here comes from whatever proxy
    // is in front of it.
    if (!r.ok) { $("list").innerHTML =
      `<p style="padding:10px;color:#ff6b6b">${r.status} from the server in front of cmuxd</p>`;
      return; }
    sessions = await r.json();
  } catch { return; }

  $("count").textContent = sessions.length + (sessions.length === 1 ? " session" : " sessions");
  $("list").innerHTML = "";
  for (const s of sessions) {
    const row = document.createElement("div");
    row.className = "row" + (s.id === current ? " on" : "");
    const badges = [];
    if (s.attention) badges.push('<span class="badge warn">attention</span>');
    if (s.status === "Busy") badges.push('<span class="badge busy">busy</span>');
    if (s.probe && s.probe.kind === "Claude") badges.push('<span class="badge">claude</span>');
    row.innerHTML =
      `<div class="name">[${s.id}] ${escapeHtml(s.label)} ${badges.join(" ")}</div>` +
      `<div class="cmd">${escapeHtml(s.cmd.join(" "))}</div>` +
      `<div class="cwd">${escapeHtml(s.cwd)} · ${s.rows}x${s.cols}</div>`;
    row.onclick = () => attach(s);
    $("list").appendChild(row);
  }

  // Land on something rather than a blank pane. Once only, so a later refresh
  // never yanks the user off the session they picked.
  if (!autoAttached && sessions.length) {
    autoAttached = true;
    const pick = want ? sessions.find(s => String(s.id) === want) : sessions[0];
    if (pick) attach(pick);
  }
}

function attach(s) {
  if (ws) { ws.onclose = null; ws.close(); }
  current = s.id;
  $("empty").hidden = true;
  $("term").hidden = false;
  if (!term) bootTerminal();
  term.reset();
  fit.fit();
  $("bar").textContent = `[${s.id}] ${s.label} — ${s.cmd.join(" ")}`;
  refresh();

  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/sessions/${s.id}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { fit.fit(); pushSize(); term.focus(); };
  ws.onmessage = (e) => {
    if (typeof e.data === "string") term.write(e.data);
    else term.write(new Uint8Array(e.data));
  };
  ws.onclose = () => term.write("\r\n\x1b[2m[disconnected]\x1b[0m\r\n");
}

$("spawn").onclick = async () => {
  const parts = $("cmd").value.trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return;
  const r = await fetch("/api/sessions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cmd: parts, rows: term ? term.rows : 40, cols: term ? term.cols : 120 }),
  });
  if (r.ok) attach(await r.json());
  else alert(await r.text());
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
