[workspace]
resolver = "2"
members = [
    "crates/cmux",
    "crates/cmux-proto",
    "crates/cmuxd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0.102"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs", "signal"] }
