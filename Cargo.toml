[workspace]
resolver = "2"
members = [
    "crates/cmux",
    "crates/cmux-proto",
    "crates/cmux-term",
    "crates/cmuxd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0.102"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["bracketed-paste"] }
portable-pty = "0.9.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
